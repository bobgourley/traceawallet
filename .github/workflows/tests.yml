name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Throwaway server inside this job only. Tests create and drop their own database.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # A skipped test fails the run: every test must run in CI.
      TAW_FAIL_ON_SKIP: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Apply every migration with the production runner
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrate_check
        run: |
          python -c "import psycopg; psycopg.connect('$TEST_DATABASE_URL', autocommit=True).execute('CREATE DATABASE migrate_check')"
          python scripts/migrate.py
          echo "second run must apply nothing:"
          python scripts/migrate.py | tee second_run.txt
          ! grep -q "applying" second_run.txt

      - name: Tests
        run: python -m pytest -v -rs
